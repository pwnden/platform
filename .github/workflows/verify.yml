name: Verify platform integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PWNDEN_CONTAINER_CPUS: '1'
    steps:
      - name: Check out platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: platform
          persist-credentials: false
      - name: Check out published challenges
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pwnden/challenges
          ref: main
          path: challenges
          persist-credentials: false
      - name: Install verified Docker Compose
        run: |
          compose_binary="$RUNNER_TEMP/docker-compose"
          curl --fail --location --retry 3 --output "$compose_binary" https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64
          printf '%s  %s\n' 'a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4' "$compose_binary" | sha256sum --check
          mkdir -p "$HOME/.docker/cli-plugins"
          install -m 755 "$compose_binary" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Prepare the selected CLI toolboxes
        working-directory: challenges
        run: |
          docker build --platform linux/amd64 --target basic --tag pwnden-cli:basic-20261003 images/cli
          docker build --platform linux/amd64 --target pcap --tag pwnden-cli:pcap-20261003 images/cli
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Build embedded player assets with the pinned frontend toolchain
        working-directory: platform
        run: docker build --file Dockerfile.web --target assets --output type=local,dest=internal/playerweb/dist .
      - name: Test platform
        working-directory: platform
        env:
          PWNDEN_CONTAINER_CPUS: '2'
        run: |
          go test ./...
          go vet ./...
      - name: Check runtime tools
        run: |
          docker version
          docker compose version
          python3 --version
      - name: Test checkout bootstrap boundaries
        working-directory: platform
        run: python3 -B tools/test_bootstrap.py
      - name: Test catalog smoke coverage
        working-directory: platform
        run: python3 -B tools/test_smoke_http.py
      - name: Verify catalog selection without host development tools
        working-directory: platform
        run: python3 -B tools/smoke_catalog.py
      - name: Verify published catalog integration
        run: python3 platform/tools/verify.py --challenges challenges
      - name: Verify actual isolation, web ingress and automatic resource recovery
        working-directory: platform
        run: PWNDEN_TEST_CHALLENGES="$(realpath ../challenges)" go test ./internal/httpapi -run '^Test(IsolatedNoteVault|WorkspaceResourcePressure)Docker$' -count=1 -v
      - name: Build native Linux package
        working-directory: platform
        run: go run ./tools/package --challenges ../challenges --out dist --target linux/amd64
      - name: Verify end-user package without Go or Git
        working-directory: platform
        run: python3 -B tools/smoke_package.py --package dist/pwnden-linux-amd64.tar.gz
      - name: Verify local player HTTP server without host SDKs
        working-directory: platform
        run: |
          go build -o dist/smoke-terminal ./tools/smoke_terminal
          python3 -B tools/smoke_http.py --package dist/pwnden-linux-amd64.tar.gz --terminal-driver dist/smoke-terminal
      - name: Verify development startup without host development tools
        working-directory: platform
        run: python3 -B tools/smoke_dev.py --checkout . --terminal-driver dist/smoke-terminal
      - name: Verify clone setup without host development tools
        working-directory: platform
        run: python3 -B tools/smoke_package.py --checkout .
